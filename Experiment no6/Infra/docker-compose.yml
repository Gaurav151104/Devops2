
services:

  jenkins:
    build: .
    container_name: exp6-jenkins
    ports:
      - "8082:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./site:/var/www/html

  apache:
    image: httpd:2.4
    container_name: exp6-apache
    ports:
      - "8081:80"
    volumes:
      - ./site:/usr/local/apache2/htdocs:ro

volumes:
  jenkins_home:
